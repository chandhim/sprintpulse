<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SprintPulse Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body { width: auto; max-width: 640px; margin: 0 auto; }
    main { padding: 16px; }
    h1 { font-size: 18px; margin: 0; }
    .setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .setting:last-child { border-bottom: 0; }
    .setting label { flex: 1; }
    .setting input { width: 90px; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .hint { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icons/icon48.png" alt="" width="24" height="24">
      <h1>SprintPulse Settings</h1>
    </div>
  </header>
  <main>
    <p class="hint">These thresholds decide the Red/Amber/Green rating. The overall status is the worst of the four areas. Defaults are shown in brackets.</p>
    <form id="form" class="card"></form>
    <div class="actions">
      <button id="saveBtn" class="primary" type="button">Save</button>
      <button id="resetBtn" class="secondary" type="button">Reset to defaults</button>
      <span id="saved" class="copied" hidden>Saved</span>
    </div>
    <p class="hint">All settings and results are stored only in this browser. SprintPulse sends no data to any server.</p>
  </main>
  <script src="lib/engine.js"></script>
  <script src="options.js"></script>
</body>
</html>
